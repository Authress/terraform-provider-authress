name: sdk-sync
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-sdk-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/2.0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check for SDK update
        id: check
        run: |
          CURRENT=$(grep 'authress/authress-sdk.go' go.mod | grep -v replace | awk '{print $2}')
          LATEST=$(go list -m -versions github.com/authress/authress-sdk.go 2>/dev/null | awk '{print $NF}')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$LATEST" ] && [ -n "$LATEST" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump SDK version
        if: steps.check.outputs.updated == 'true'
        run: |
          go get github.com/authress/authress-sdk.go@${{ steps.check.outputs.latest }}
          go mod tidy

      - name: Commit and push
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "🤖 bump authress-sdk.go ${{ steps.check.outputs.current }} → ${{ steps.check.outputs.latest }}"
          git push

      - name: Trigger release build
        if: steps.check.outputs.updated == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches \
            -d '{"ref":"release/2.0"}'
